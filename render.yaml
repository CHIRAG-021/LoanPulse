# ==============================================================================
services:
  - type: web
    name: loanpulse-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask --app wsgi:app init-db --seed && gunicorn --config gunicorn.conf.py wsgi:app"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loanpulse-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: BEHIND_PROXY
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: loanpulse-db
    plan: free
    databaseName: loanpulse_prod
    user: loanpulse_user