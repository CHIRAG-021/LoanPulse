<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanPulse — Verifying Window Session</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0b0f19;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .resolver-box {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 32px 40px;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        (function() {
            try {
                var wid = sessionStorage.getItem('lp_wid');
                if (!wid && window.name && window.name.indexOf('win_') === 0) {
                    wid = window.name;
                    sessionStorage.setItem('lp_wid', wid);
                }

                if (wid) {
                    // This tab is an established window session. Reload with the window identifier.
                    var url = new URL(window.location.href);
                    url.searchParams.set('wid', wid);
                    window.location.replace(url.toString());
                    return;
                }
            } catch (e) {}

            // Truly a new tab or window without an established session.
            // Require login as per window-scoped authentication policy.
            var targetPath = window.location.pathname;
            var loginUrl = '/login';
            if (targetPath.indexOf('/customer') === 0 || targetPath.indexOf('/applications') === 0) {
                loginUrl = '/login/user';
            } else if (targetPath.indexOf('/officer') === 0 || targetPath.indexOf('/manager') === 0) {
                loginUrl = '/login/admin';
            }
            var nextParam = encodeURIComponent(targetPath + window.location.search);
            window.location.replace(loginUrl + '?next=' + nextParam);
        })();
    </script>
</head>
<body>
    <div class="resolver-box">
        <div class="spinner"></div>
        <p style="margin: 0; font-size: 14px; font-weight: 500;">Verifying session...</p>
    </div>
    <noscript>
        <div class="resolver-box">
            <p style="margin-bottom: 16px;">Authentication required. Please sign in to continue.</p>
            <a href="/login" style="color: #60a5fa; text-decoration: underline;">Sign In to LoanPulse</a>
        </div>
    </noscript>
</body>
</html>
